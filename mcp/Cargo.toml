[package]
name = "mcp-perc5ive"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "MCP server tool catalogue for Perc5ive — exposes on-chain state and simulation endpoints to AI assistants"

[lib]
path = "src/lib.rs"

[[bin]]
name = "mcp-perc5ive"
path = "src/bin/server.rs"

[dependencies]
serde_json = "1.0"
# Sibling crate — lets the simulation tools exercise the same Rust references
# that the bytecode handlers conform against.
perc5ive = { path = ".." }
