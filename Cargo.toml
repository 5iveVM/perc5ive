[package]
name = "perc5ive"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Percolator risk engine ported to 5ive DSL + hand-written bytecode for u256 hotspots"
build = "build.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "link-perc5ive"
path = "src/bin/link_perc5ive.rs"

[[bin]]
name = "normalize-dsl-header"
path = "src/bin/normalize_dsl_header.rs"

[dependencies]
# Mono-repo path deps. The 5iveVM team consolidated the previously-separate
# five-protocol / five-vm-mito / five-dsl-compiler repos into
# https://github.com/5iveVM/five-mono. A sibling `five-mono/` checkout is
# required.
five-protocol = { path = "../five-mono/five-protocol" }
five-vm-mito = { path = "../five-mono/five-vm-mito" }

[build-dependencies]
# Compiles dsl/src/main.v + markets/*/src/main.v → target/*.fbin at build.
five-dsl-compiler = { path = "../five-mono/five-dsl-compiler" }

[dev-dependencies]
# Version-pinned to match five-vm-mito's dep so the test account-info shim
# (tests/common/mod.rs) mirrors the exact internal Account layout. Bump in
# lockstep with mito.
pinocchio = "=0.9.2"
