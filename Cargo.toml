[package]
name = "perc5ive"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Percolator risk engine ported to 5ive DSL + hand-written bytecode for u256 hotspots"
build = "build.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "link-perc5ive"
path = "src/bin/link_perc5ive.rs"

[[bin]]
name = "normalize-dsl-header"
path = "src/bin/normalize_dsl_header.rs"

[[bin]]
name = "link-meta"
path = "src/bin/link_meta.rs"

[dependencies]
# Mono-repo path deps. The 5iveVM team consolidated the previously-separate
# five-protocol / five-vm-mito / five-dsl-compiler repos into
# https://github.com/5iveVM/five-mono. A sibling `five-mono/` checkout is
# required.
five-protocol = { path = "../five-mono/five-protocol" }
five-vm-mito = { path = "../five-mono/five-vm-mito" }

[build-dependencies]
# Compiles dsl/src/main.v + markets/*/src/main.v → target/*.fbin at build.
five-dsl-compiler = { path = "../five-mono/five-dsl-compiler" }

[dev-dependencies]
# MUST be the SAME crate instance five-vm-mito links, not crates.io 0.9.2 —
# `MitoVM::execute_direct` takes `&[five_vm_mito::AccountInfo]`, which is this
# vendored pinocchio's `AccountInfo`. A crates.io copy of the same version is a
# distinct type that fails to unify (the runtime-account test path can't compile
# against it). Points at five-mono's vendored copy so `tests/common/mod.rs` can
# build accounts the VM actually accepts, via pinocchio's public test
# constructor `AccountInfo::new`.
pinocchio = { path = "../five-mono/third_party/pinocchio" }
