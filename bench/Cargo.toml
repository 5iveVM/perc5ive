[package]
name = "perc5ive-bench"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "PercolatorBench — conformance + adversarial test suite for Percolator-compatible implementations"

[lib]
path = "src/lib.rs"

[features]
# Gates the pre-mono u256/i256 conformance modules. The mono port dropped
# the multiprecision opcodes; these tests reference dead symbols. Re-enable
# only if the multiprecision DSL surface is reintroduced.
legacy_u256 = ["dsl_leg"]

# DSL leg of the differential — wires in `perc5ive` and the mono
# `five-protocol` / `five-vm-mito` crates so probes can execute the 5ive
# DSL port. Off by default until Session 3 plugs probes in.
dsl_leg = ["dep:perc5ive", "dep:five-protocol", "dep:five-vm-mito"]

[dependencies]
# Rust reference engine — the (a) leg of the three-way differential.
percolator = { path = "../hello_slab/percolator" }

# Bounty-hunt differential harness dependencies.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rand_xorshift = "0.3"
clap = { version = "4", features = ["derive"] }
thiserror = "1"

# Bounty-hunt BPF leg. litesvm 0.11 targets the Agave/Anza Solana 2.x
# runtime; the BPF program loader is fmt-version agnostic so it loads
# 1.18-built `.so` blobs fine.
litesvm = "0.11"
# Split Solana 2.x/3.x crates — versions match what litesvm 0.11 pulls
# transitively so the Account / Address types line up bit-exact.
solana-account = "3"
solana-address = "2"
solana-keypair = "2"
solana-signer = "2"

# DSL leg deps. Off by default — `--features dsl_leg` wires the 5ive DSL
# port in so probes can compare against it. Session 2 leaves this off
# because the pre-mono modules in this crate aren't wired to the
# post-mono `perc5ive::bytecode` surface yet (Session 3 work).
perc5ive = { path = "..", optional = true }
five-protocol = { path = "../../five-mono/five-protocol", optional = true }
five-vm-mito = { path = "../../five-mono/five-vm-mito", optional = true }

[dev-dependencies]
pinocchio = "=0.9.2"

[[bin]]
name = "bounty_fuzz"
path = "src/bin/bounty_fuzz.rs"
