[package]
name = "perc5ive-bench"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "PercolatorBench — conformance + adversarial test suite for Percolator-compatible implementations"

[lib]
path = "src/lib.rs"

[dependencies]
percolator = { path = "../hello_slab/percolator" }
perc5ive = { path = ".." }
# Mono workspace paths — must match perc5ive's so the lockfile resolves a single
# five-protocol / five-vm-mito (the pre-mono ../../five-* paths collided).
five-protocol = { path = "../../five-mono/five-protocol" }
five-vm-mito = { path = "../../five-mono/five-vm-mito" }

[dev-dependencies]
pinocchio = { path = "../../five-mono/third_party/pinocchio" }
